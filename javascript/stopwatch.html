<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Stopwatch</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }
      .stopwatch-container {
        text-align: center;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .display {
        font-size: 3rem;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
        margin-bottom: 20px;
        color: #333;
      }
      .controls button {
        font-size: 1rem;
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .start {
        background-color: #4caf50;
        color: white;
      }
      .start:hover {
        background-color: #45a049;
      }
      .stop {
        background-color: #f44336;
        color: white;
      }
      .stop:hover {
        background-color: #da190b;
      }
      .reset {
        background-color: #ff9800;
        color: white;
      }
      .reset:hover {
        background-color: #e68a00;
      }
    </style>
  </head>
  <body>
    <div class="stopwatch-container">
      <div class="display" id="display">00:00:00.00</div>
      <div class="controls">
        <button class="start" id="startBtn">Start</button>
        <button class="stop" id="stopBtn">Stop</button>
        <button class="reset" id="resetBtn">Reset</button>
      </div>
    </div>

    <script>
      let startTime = 0;
      let elapsedTime = 0;
      let timerInterval;

      const display = document.getElementById("display");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const resetBtn = document.getElementById("resetBtn");

      function formatTime(ms) {
        let hours = Math.floor(ms / 3600000);
        let minutes = Math.floor((ms % 3600000) / 60000);
        let seconds = Math.floor((ms % 60000) / 1000);
        let centiseconds = Math.floor((ms % 1000) / 10);

        return (
          (hours < 10 ? "0" : "") +
          hours +
          ":" +
          (minutes < 10 ? "0" : "") +
          minutes +
          ":" +
          (seconds < 10 ? "0" : "") +
          seconds +
          "." +
          (centiseconds < 10 ? "0" : "") +
          centiseconds
        );
      }

      function updateTime() {
        elapsedTime = Date.now() - startTime;
        display.textContent = formatTime(elapsedTime);
      }

      startBtn.addEventListener("click", () => {
        if (!timerInterval) {
          // Adjust startTime to account for pauses
          startTime = Date.now() - elapsedTime;
          timerInterval = setInterval(updateTime, 10); // Updates every 10 milliseconds
        }
      });

      stopBtn.addEventListener("click", () => {
        clearInterval(timerInterval);
        timerInterval = null;
      });

      resetBtn.addEventListener("click", () => {
        clearInterval(timerInterval);
        timerInterval = null;
        elapsedTime = 0;
        display.textContent = "00:00:00.00";
      });
    </script>
  </body>
</html>
